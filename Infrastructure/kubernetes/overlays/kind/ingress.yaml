apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: traffic-dashboard

  labels:
    app.kubernetes.io/name: traffic-dashboard
    app.kubernetes.io/part-of: red-blacksmith

spec:
  ingressClassName: traefik

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: traffic-dashboard
                port:
                  number: 8080