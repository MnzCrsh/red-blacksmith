apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool

metadata:
  name: redblacksmith-pool

  labels:
    strimzi.io/cluster: redblacksmith

spec:
  replicas: 1

  roles:
    - controller
    - broker

  storage:
    type: jbod

    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
        kraftMetadata: shared

  resources:
    requests:
      cpu: 250m
      memory: 768Mi

    limits:
      cpu: "1"
      memory: 1536Mi