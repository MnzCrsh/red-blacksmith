apiVersion: apps/v1
kind: Deployment

metadata:
  name: traffic-dashboard

  labels:
    app.kubernetes.io/name: traffic-dashboard
    app.kubernetes.io/part-of: red-blacksmith

spec:
  replicas: 1
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-dashboard

  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-dashboard
        app.kubernetes.io/part-of: red-blacksmith

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: traffic-dashboard

          image: redblacksmith/traffic-dashboard:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 128Mi

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3