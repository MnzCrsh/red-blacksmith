apiVersion: apps/v1
kind: Deployment

metadata:
  name: traffic-emulator
  labels:
    app.kubernetes.io/name: traffic-emulator
    app.kubernetes.io/part-of: red-blacksmith

spec:
  replicas: 1
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-emulator

  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-emulator
        app.kubernetes.io/part-of: red-blacksmith

    spec:
      terminationGracePeriodSeconds: 10

      containers:
        - name: traffic-emulator
          image: redblacksmith/traffic-emulator:local
          imagePullPolicy: IfNotPresent

          workingDir: /opt/traffic-emulator

          command:
            - /bin/sh
            - -c

          args:
            - while true; do sleep 3600; done

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi