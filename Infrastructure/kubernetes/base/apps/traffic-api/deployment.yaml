apiVersion: apps/v1
kind: Deployment

metadata:
  name: traffic-api

  labels:
    app.kubernetes.io/name: traffic-api
    app.kubernetes.io/part-of: red-blacksmith

spec:
  replicas: 1
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-api
        app.kubernetes.io/part-of: red-blacksmith

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: traffic-api

          image: redblacksmith/traffic-api:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: redblacksmith-config

          env:
            - name: POSTGRES_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redblacksmith-secrets
                  key: POSTGRES_API_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 512Mi

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 3