apiVersion: v1
kind: Service

metadata:
  name: traffic-api

  labels:
    app.kubernetes.io/name: traffic-api
    app.kubernetes.io/part-of: red-blacksmith

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: traffic-api

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http