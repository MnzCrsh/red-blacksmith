apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - config/app-config.yaml
  - config/observability-config.yaml
  - apps/traffic-ingestion
  - apps/traffic-processing
  - apps/traffic-api
  - apps/traffic-dashboard

patches:
  - path: patches/traffic-ingestion-observability.yaml
  - path: patches/traffic-processing-observability.yaml
  - path: patches/traffic-api-observability.yaml