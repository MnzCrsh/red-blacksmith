apiVersion: v1
kind: ConfigMap
metadata:
  name: redblacksmith-config
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"

  Kafka__BootstrapServers: "redblacksmith-kafka-bootstrap:9092"

  POSTGRES_HOST: "postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "traffic"
  POSTGRES_PROCESSING_USERNAME: "traffic_processing"
  POSTGRES_API_USERNAME: "traffic_api"

  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: "traffic"
  CLICKHOUSE_USERNAME: "clickhouse"