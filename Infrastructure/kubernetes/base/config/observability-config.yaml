apiVersion: v1
kind: ConfigMap
metadata:
  name: redblacksmith-observability-config
  namespace: redblacksmith
  labels:
    app.kubernetes.io/name: redblacksmith-observability
    app.kubernetes.io/part-of: red-blacksmith
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=kind,service.namespace=redblacksmith
