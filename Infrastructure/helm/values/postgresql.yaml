fullnameOverride: postgresql

architecture: standalone

auth:
  enablePostgresUser: true
  database: traffic
  existingSecret: redblacksmith-secrets

  secretKeys:
    adminPasswordKey: POSTGRES_SUPERUSER_PASSWORD

primary:
  pgHbaConfiguration: |-
    local   all   all                 trust
    host    all   all   127.0.0.1/32  trust
    host    all   all   ::1/128       trust
    host    all   all   10.244.0.0/16 trust
  service:
    type: ClusterIP

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi