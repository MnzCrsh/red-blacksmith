deployment:
  replicas: 1

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    namespaces:
      - redblacksmith
      - observability
      - traefik-system

  kubernetesCRD:
    enabled: false

service:
  enabled: true
  spec:
    type: NodePort

ports:
  web:
    port: 8000
    exposedPort: 80
    nodePort: 30080

  websecure:
    port: 8443
    exposedPort: 443
    nodePort: 30443

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi